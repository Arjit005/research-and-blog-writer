[project]
name = "research_and_blog_writer"
version = "0.1.0"
description = "A crewAI multi-agent system that researches any topic and generates a quality-checked blog post"
authors = [{ name = "Arjit Katiyar" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,litellm,tools]>=1.15.21,<2.0.0",
    "ddgs>=9.16.0",
    "duckduckgo-search>=8.1.1",
    "streamlit>=1.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Include these directories/files in the built package
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "skills"]

[tool.crewai]
# Tells crewAI CLI this is a crew project using JSON-first config
type = "crew"
definition = "crew.jsonc"
project_id = "a2ff9f2e-4c04-4f6b-af36-9a21aa57f3f7"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]
