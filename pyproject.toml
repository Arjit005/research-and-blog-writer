[project]
name = "research_and_blog_writer"
version = "0.1.0"
description = "A crewAI multi-agent system that researches any topic and generates a quality-checked blog post"
authors = [{ name = "Arjit Katiyar" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai[google-genai,litellm,tools]>=1.15.21,<2.0.0",
    "streamlit>=1.63.0",
    "python-dotenv>=1.0.0",
    "ddgs>=9.16.0",
    "duckduckgo-search>=8.0.0",
    "pymysql>=1.2.0",
    "cryptography>=43.0.0",
    "markdown>=3.6.0",
    "textstat>=0.7.3",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.52.4",
    "pydantic>=2.12.5",
    "httpx>=0.28.1",
    "langsmith>=0.1.0",
    "google-auth>=2.30.0",
    "requests>=2.31.0",
    # Security: minimum patched versions for pip-audit findings (transitive deps pinned as floors where safe)
    "pillow>=13.0.0",
    "aiohttp>=3.14.4",
    "certifi>=2026.10.18",
    "multidict>=6.9.1",
    "opentelemetry-api>=1.44.0,<1.45",
    "pyasn1>=0.6.5",
    "PyJWT>=2.15.0",
    "urllib3>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Include these directories/files in the built package
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "security", "llmops", "memory", "ui", "core", "auth", "cache", "llm_fallback.py", "database.py"]

[tool.crewai]
# Tells crewAI CLI this is a crew project using JSON-first config
type = "crew"
definition = "crew.jsonc"
project_id = "a2ff9f2e-4c04-4f6b-af36-9a21aa57f3f7"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", ".git", "__pycache__", "frontend", "docs", "tests/.tmp"]

