services:
  - type: web
    name: research-and-blog-studio
    runtime: python
    buildCommand: "pip install -r requirements.txt && (cd frontend && npm install && npm run build)"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AUTH_DEV_MODE
        value: "true"
